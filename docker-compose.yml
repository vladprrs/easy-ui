services:
  easy-ui:
    image: ghcr.io/vladprrs/easy-ui:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # Host facts (R0 revision, 2026-08-03): 8 vCPU AMD Zen 4 / 8 GB RAM shared with
    # Dokploy+traefik. Service gets half the host; the old 1g limit was a conservative
    # over-provision inherited from the family plan.
    mem_limit: 4g
    cpus: 4
    environment:
      BASIC_AUTH: ${BASIC_AUTH:-}
      LEGACY_BASIC_AUTH: ${LEGACY_BASIC_AUTH:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      REUSE_GATE: ${REUSE_GATE:-shadow}
      EASYUI_SURFACES: ${EASYUI_SURFACES:-1}
      EASYUI_VALIDATE_DISABLED: ${EASYUI_VALIDATE_DISABLED:-}
      EASYUI_ACCEPTANCE_DISABLED: ${EASYUI_ACCEPTANCE_DISABLED:-}
      EASYUI_THEME_RESOLVER_V2_DISABLED: ${EASYUI_THEME_RESOLVER_V2_DISABLED:-}
      EASYUI_ACCEPTANCE_MATRIX: ${EASYUI_ACCEPTANCE_MATRIX:-1}
      # Пересчёт вердикта и re-diff по сохранённым кадрам (план 2026-08-04, W1). Default on;
      # `0` выключает **обе** ветки сразу — любой промах `case_fingerprint` уводит в пересъёмку,
      # но никогда в перенос устаревшего вердикта. Откат флага не ретроактивен: уже записанные
      # пересчитанные строки остаются годными (их чистка — bump CASE_FINGERPRINT_ALGO_VERSION).
      EASYUI_ACCEPTANCE_VERDICT_RECOMPUTE: ${EASYUI_ACCEPTANCE_VERDICT_RECOMPUTE:-1}
      # Аварийный откат promotion policy (план 2026-08-04, W3). Default **off**: promote проверяет
      # профиль рана против `PROMOTION_POLICY_PROFILES`. `1` возвращает докритическое равенство
      # хэшей профиля рана и кандидата, то есть возврат дефекта P0-2 (pixel-strict-раны снова
      # перестанут промоутиться) — включать только как временную меру.
      EASYUI_PROMOTE_POLICY_STRICT: ${EASYUI_PROMOTE_POLICY_STRICT:-}
      EASYUI_COMPOSITION_V3: ${EASYUI_COMPOSITION_V3:-1}
      EASYUI_RENDERER_FLAGS: ${EASYUI_RENDERER_FLAGS:-}
      EASYUI_RENDERER_EPOCH: ${EASYUI_RENDERER_EPOCH:-}
      EASYUI_RENDERER_GUARD_DISABLED: ${EASYUI_RENDERER_GUARD_DISABLED:-}
      EASYUI_RENDERER_STRICT_MANIFEST: ${EASYUI_RENDERER_STRICT_MANIFEST:-}
      EASYUI_CAPTURE_RECEIPTS_DISABLED: ${EASYUI_CAPTURE_RECEIPTS_DISABLED:-}
      # R7a (signals-режим визуального вердикта) включён по решению пользователя 2026-08-04 при
      # незакрытых прекондициях плана renderer-contract-2 §R7a (пороги causes.ts калиброваны под
      # pixelmatch-шкалу, exact-rgba даёт ~2× большие rawDiffPct; класс «перекраска глифов» может
      # прятаться в pass/renderer_residual). Откат — задать 0 в Dokploy env.
      EASYUI_VISUAL_SIGNALS_V2: ${EASYUI_VISUAL_SIGNALS_V2:-1}
      # R9a: тёплый пул воркеров капчура; численный критерий прод-включения выполнен (warm p95 705 мс).
      EASYUI_RENDERER_POOL: ${EASYUI_RENDERER_POOL:-1}
      EASYUI_CAPTURE_CACHE: ${EASYUI_CAPTURE_CACHE:-}
      # ── Kill-switch'и волны 2026-08-07 (ретроспектива миграции YP v2), §W11. Все восемь —
      # аварийные, дефолт **пустой** (= фича включена); без строки здесь переменная в контейнер
      # не попадает вовсе, и «выключить в Dokploy» было бы невозможно. Каждая перечислена
      # поимённо, а не собрана в один тумблер: волны инвалидируют разные слои каскада, и общий
      # выключатель гасил бы вместе с дефектом три здоровых фичи.
      #
      # W1a: новый путь вердикта геометрии (`expectedSurfaces`/per-surface) → легаси-ветка целиком.
      EASYUI_GEOMETRY_SURFACES_DISABLED: ${EASYUI_GEOMETRY_SURFACES_DISABLED:-}
      # W2: барьер ресурсов. Читается **один раз на процесс** (политика входит в `policyProfileHash`/
      # `rendererFingerprint`), поэтому смена значения — рестарт сервера. Выключение возвращает
      # каждый профиль в **свою** доволновую политику (default→v1, strict→v2, reference→v2) и
      # сдвигает `rendererFingerprint` обратно: раны по обе стороны тумблера мультиран-promote
      # не смешивать (`422 acceptance_renderer_mismatch`).
      EASYUI_RESOURCE_BARRIER_DISABLED: ${EASYUI_RESOURCE_BARRIER_DISABLED:-}
      # W3: candidate dependency overlay. Уже созданные overlay-раны не трогает — запрещает новые
      # (`422 candidate_overlay_disabled`). Это же положение — режим rollback-window миграции v33.
      EASYUI_CANDIDATE_OVERLAY_DISABLED: ${EASYUI_CANDIDATE_OVERLAY_DISABLED:-}
      # W5: импакт-план съёмки. Гасит и ручку `snap-plan` (404), и запись кадров экранов — при
      # откате образа в окне миграции v34 писать в несуществующую таблицу некуда.
      EASYUI_IMPACTED_SNAP_DISABLED: ${EASYUI_IMPACTED_SNAP_DISABLED:-}
      # W4: сага миграционного коммита (`/api/migration-commits*` → 404). Существующие саги
      # остаются на своей фазе и продолжаются `advance` после обратного включения.
      EASYUI_MIGRATION_COMMIT_DISABLED: ${EASYUI_MIGRATION_COMMIT_DISABLED:-}
      # W7: suggested policy — слой report-only; гасит и предложение бюджета, и advisory
      # `policy_exception_stale`. Ни вердикт, ни promote от него не зависят.
      EASYUI_SUGGESTED_POLICY_DISABLED: ${EASYUI_SUGGESTED_POLICY_DISABLED:-}
      # W8: пакеты исходников Figma (ручки → 404, `figma.sourcePackageId` → 422). Режим
      # rollback-window миграции v36: старый образ о таблице не знает.
      EASYUI_SOURCE_PACKAGE_DISABLED: ${EASYUI_SOURCE_PACKAGE_DISABLED:-}
      # W9: **render-affecting** аварийный тумблер (в отпечатки не входит сознательно): хост
      # перестаёт применять Zod-дефолты схемы. Приёмка флагнутых семей при нём недействительна
      # (`runtime_defaults_disabled` в accept-status); штатный откат компонента — републикация
      # исходника без `capabilities.runtimeSchemaDefaults`.
      EASYUI_RUNTIME_DEFAULTS_DISABLED: ${EASYUI_RUNTIME_DEFAULTS_DISABLED:-}
    expose:
      - "8787"
    volumes:
      - easy-ui-data:/app/data
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8787/api/health'); const b=await r.json(); if(r.status!==200||b.status!=='ready') process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  easy-ui-data:
