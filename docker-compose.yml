services:
  easy-ui:
    image: ghcr.io/vladprrs/easy-ui:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # Host facts (R0 revision, 2026-08-03): 8 vCPU AMD Zen 4 / 8 GB RAM shared with
    # Dokploy+traefik. Service gets half the host; the old 1g limit was a conservative
    # over-provision inherited from the family plan.
    mem_limit: 4g
    cpus: 4
    environment:
      BASIC_AUTH: ${BASIC_AUTH:-}
      LEGACY_BASIC_AUTH: ${LEGACY_BASIC_AUTH:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      REUSE_GATE: ${REUSE_GATE:-shadow}
      EASYUI_SURFACES: ${EASYUI_SURFACES:-1}
      EASYUI_VALIDATE_DISABLED: ${EASYUI_VALIDATE_DISABLED:-}
      EASYUI_ACCEPTANCE_DISABLED: ${EASYUI_ACCEPTANCE_DISABLED:-}
      EASYUI_THEME_RESOLVER_V2_DISABLED: ${EASYUI_THEME_RESOLVER_V2_DISABLED:-}
      EASYUI_ACCEPTANCE_MATRIX: ${EASYUI_ACCEPTANCE_MATRIX:-1}
      # Пересчёт вердикта и re-diff по сохранённым кадрам (план 2026-08-04, W1). Default on;
      # `0` выключает **обе** ветки сразу — любой промах `case_fingerprint` уводит в пересъёмку,
      # но никогда в перенос устаревшего вердикта. Откат флага не ретроактивен: уже записанные
      # пересчитанные строки остаются годными (их чистка — bump CASE_FINGERPRINT_ALGO_VERSION).
      EASYUI_ACCEPTANCE_VERDICT_RECOMPUTE: ${EASYUI_ACCEPTANCE_VERDICT_RECOMPUTE:-1}
      EASYUI_COMPOSITION_V3: ${EASYUI_COMPOSITION_V3:-1}
      EASYUI_RENDERER_FLAGS: ${EASYUI_RENDERER_FLAGS:-}
      EASYUI_RENDERER_EPOCH: ${EASYUI_RENDERER_EPOCH:-}
      EASYUI_RENDERER_GUARD_DISABLED: ${EASYUI_RENDERER_GUARD_DISABLED:-}
      EASYUI_RENDERER_STRICT_MANIFEST: ${EASYUI_RENDERER_STRICT_MANIFEST:-}
      EASYUI_CAPTURE_RECEIPTS_DISABLED: ${EASYUI_CAPTURE_RECEIPTS_DISABLED:-}
      EASYUI_VISUAL_SIGNALS_V2: ${EASYUI_VISUAL_SIGNALS_V2:-}
      EASYUI_RENDERER_POOL: ${EASYUI_RENDERER_POOL:-}
      EASYUI_CAPTURE_CACHE: ${EASYUI_CAPTURE_CACHE:-}
    expose:
      - "8787"
    volumes:
      - easy-ui-data:/app/data
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8787/api/health'); const b=await r.json(); if(r.status!==200||b.status!=='ready') process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  easy-ui-data:
